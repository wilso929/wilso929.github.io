<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiative</title>
	<link rel="stylesheet" href="main.css" />
</head>
<body>
    <header>
        <h1 id="title">Initiative Tracker</h1>
    </header>
    <main>
		<form id="input-form">
            <label for="name">Name: <input class="input" required ="text" id="name" name="name"></label>
            <label for="roll">Roll: <input class="input" required pattern="^\d*(\.\d{0,2})?$" id="roll" name="roll"></label>
			<div class="break"></div>
            <input class="btn" type="submit" id="add-char" value="Add Char">
        </form>
		<div id="copy-container">
			<div id="copy-list">
			</div>
			<button class="btn" type="button" 
			id="copy-btn" 
			value="Copy List" onclick="copyEvent('copy-list')">Copy</button>
		</div>
		<div id="char-container">
			<h2>Characters</h2>
			<form id="concentration-form" class="hidden-form">
				<h4>Enter the spell you're concentrating on</h4>
				<div class="break"></div>
				<label for="spell">Spell: <input class="input" required ="text" id="spell" name="spell"></label>
				<div class="break"></div>
				<input class="btn" type="submit" id="submit-spell" value="Submit">
				<input class="btn" type="button" id="close-spell" value="Close">
			</form>
			<form id="custom-form" class="hidden-form">
				<h4>Enter your custom status</h4>
				<div class="break"></div>
				<label for="status">Status: <input class="input" required ="text" id="custom-status" name="status"></label>
				<div class="break"></div>
				<input class="btn" type="submit" id="submit-custom" value="Submit">
				<input class="btn" type="button" id="close-custom" value="Close">
			</form>
			<button class="btn" type="button" id="clear-btn">Clear List</button>
			<div id="char-list"></div>
		</div>
	</main>
	<script>
		function copyEvent(id)
		{
			var str = document.getElementById(id);
			window.getSelection().selectAllChildren(str);
			document.execCommand("Copy")
		}
	</script>
	<script src="main.js"></script>
</body>
</html>
